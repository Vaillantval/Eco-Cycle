<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — EcoCycle Haiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:#f5f0e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:white;border-radius:24px;padding:56px 48px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.08);}
    .icon{font-size:5rem;margin-bottom:16px;}
    .code{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;color:#f07c1a;line-height:1;}
    h1{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;color:#1a1a1a;margin:12px 0 8px;}
    p{color:#666;font-size:0.95rem;line-height:1.6;margin-bottom:28px;}
    .btn{display:inline-block;padding:12px 28px;background:#0d7a45;color:white;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.9rem;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <div class="code">500</div>
    <h1>Erreur serveur</h1>
    <p>Quelque chose s'est mal passé de notre côté. Notre équipe a été notifiée et travaille à résoudre le problème.</p>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
