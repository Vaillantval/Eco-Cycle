{% extends 'base.html' %}

{% block title %}Nouveau mot de passe — EcoCycle Haiti{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">♻ EcoCycle</div>
    <h2>Nouveau mot de passe</h2>
    <p class="auth-subtitle">Choisissez un nouveau mot de passe sécurisé</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'reset_password_confirm_web' token %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="new_password">Nouveau mot de passe</label>
        <input type="password" id="new_password" name="new_password"
               placeholder="8 caractères minimum"
               required class="form-control" autofocus>
      </div>
      <div class="form-group">
        <label for="password_confirm">Confirmer</label>
        <input type="password" id="password_confirm" name="password_confirm"
               placeholder="••••••••"
               required class="form-control">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
        Changer le mot de passe
      </button>
    </form>

    <p class="auth-switch">
      <a href="{% url 'web_login' %}">← Retour à la connexion</a>
    </p>
  </div>
</div>
{% endblock %}
