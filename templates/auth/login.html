{% extends 'base.html' %}

{% block title %}Connexion — EcoCycle Haiti{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">♻ EcoCycle</div>
    <h2>Bienvenue</h2>
    <p class="auth-subtitle">Connectez-vous à votre compte</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'web_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               value="{{ email|default:'' }}"
               placeholder="votre@email.com"
               required class="form-control" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••"
               required class="form-control">
        <a href="{% url 'reset_password' %}" class="forgot-link">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
        Se connecter
      </button>
    </form>

    <p class="auth-switch">
      Pas encore de compte ?
      <a href="{% url 'web_register' %}">S'inscrire gratuitement</a>
    </p>
  </div>
</div>
{% endblock %}
