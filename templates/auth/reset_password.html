{% extends 'base.html' %}

{% block title %}Mot de passe oublié — EcoCycle Haiti{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">♻ EcoCycle</div>
    <h2>Réinitialiser</h2>
    <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

    <form method="POST" action="{% url 'reset_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="votre@email.com"
               required class="form-control" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
        Envoyer le lien
      </button>
    </form>

    <p class="auth-switch">
      <a href="{% url 'web_login' %}">← Retour à la connexion</a>
    </p>
  </div>
</div>
{% endblock %}
