{% extends 'admin_panel/base_admin.html' %}
{% block title %}Carte des ramassages — EcoCycle Admin{% endblock %}

{% block content %}
<div class="admin-page-header">
  <div>
    <h2 class="admin-page-title">Carte des ramassages</h2>
    <p class="admin-page-subtitle">{{ total }} ramassage{{ total|pluralize }} géolocalisé{{ total|pluralize }}</p>
  </div>
  <a href="{% url 'admin_pickups' %}" class="btn btn-secondary">← Liste</a>
</div>

<div class="data-card" style="padding:0; overflow:hidden;">
  <div id="map" style="height:600px; width:100%; border-radius:12px;"></div>
</div>

<div class="data-card" style="margin-top:16px; padding:16px;">
  <div style="display:flex; gap:24px; flex-wrap:wrap; font-size:13px;">
    <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#f59e0b;margin-right:6px;"></span>Demandé</span>
    <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#3b82f6;margin-right:6px;"></span>Assigné</span>
    <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#8b5cf6;margin-right:6px;"></span>En transit</span>
    <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#10b981;margin-right:6px;"></span>Complété</span>
    <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#ef4444;margin-right:6px;"></span>Échoué</span>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const POINTS = {{ points_json|safe }};

const STATUS_COLORS = {
  requested:  '#f59e0b',
  assigned:   '#3b82f6',
  in_transit: '#8b5cf6',
  arrived:    '#06b6d4',
  completed:  '#10b981',
  failed:     '#ef4444',
  cancelled:  '#6b7280',
};

const map = L.map('map').setView([18.9712, -72.2852], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

POINTS.forEach(function(p) {
  const color = STATUS_COLORS[p.status] || '#6b7280';
  const icon = L.divIcon({
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    className: '',
  });
  const popup = `
    <b>${p.user}</b><br>
    ${p.city} — ${p.date}<br>
    Statut : <strong>${p.status}</strong><br>
    ${p.collector ? 'Collecteur : ' + p.collector : ''}
    <br><a href="/panel/pickups/${p.id}/">Voir le détail →</a>
  `;
  L.marker([p.lat, p.lon], { icon }).addTo(map).bindPopup(popup);
});

if (POINTS.length > 0) {
  const bounds = POINTS.map(p => [p.lat, p.lon]);
  map.fitBounds(bounds, { padding: [30, 30] });
}
</script>
{% endblock %}
