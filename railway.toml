[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'python manage.py migrate --noinput && python init_site.py && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 4 --worker-class gthread --timeout 120 --access-logfile - --log-level warning'"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "always"
restartPolicyMaxRetries = 10
